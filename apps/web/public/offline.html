<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#18181b" />
    <meta name="robots" content="noindex" />
    <title>Offline · Qdot</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #18181b;
        color: #f5f0eb;
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }
      main { display: flex; max-width: 360px; flex-direction: column; align-items: center; gap: 16px; }
      .mark { width: 48px; height: 48px; border-radius: 12px; background: #fff; display: grid; place-items: center; }
      .mark i { width: 24px; height: 24px; border-radius: 6px; background: #18181b; display: grid; place-items: center; }
      .mark b { width: 9px; height: 9px; border-radius: 2px; background: #f5f0eb; }
      h1 { margin: 8px 0 0; font-size: 24px; font-weight: 800; }
      p { margin: 0; color: #a39eac; }
      button {
        margin-top: 8px;
        height: 44px;
        padding: 0 24px;
        border: 0;
        border-radius: 10px;
        background: #e8503a;
        color: #fafafa;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover { background: #ee6752; }
      button:focus-visible { outline: 2px solid #fafafa; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <span class="mark" aria-hidden="true"><i><b></b></i></span>
      <h1 id="title">You're offline</h1>
      <p id="text">Qdot needs a connection to load your QR codes and analytics. Printed QR codes keep working.</p>
      <button id="retry" type="button">Try again</button>
    </main>
    <script>
      // Served by the service worker when the network is unreachable: no framework, no external files.
      var fr = /(?:^|;\s*)qdot-locale=fr/.test(document.cookie) || (!/qdot-locale=en/.test(document.cookie) && /^fr\b/i.test(navigator.language || ""));
      if (fr) {
        document.documentElement.lang = "fr";
        document.title = "Hors ligne · Qdot";
        document.getElementById("title").textContent = "Vous êtes hors ligne";
        document.getElementById("text").textContent = "Qdot a besoin d'une connexion pour charger vos QR codes et vos statistiques. Les QR codes imprimés continuent de fonctionner.";
        document.getElementById("retry").textContent = "Réessayer";
      }
      document.getElementById("retry").addEventListener("click", function () { location.reload(); });
      window.addEventListener("online", function () { location.reload(); });
    </script>
  </body>
</html>
